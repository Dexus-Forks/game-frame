[package]
name = "gameframe-launcher"
description = "Starts a game described in frame.json behind the frame: settings, renderer, file lists from the game's folder, and back to the launcher or the desktop when the game ends"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Its own workspace, so the desktop's dependencies stay out of crates/.
[workspace]

[dependencies]
gameframe-frame = { path = "../crates/frame" }
gameframe-frame-ui = { path = "../crates/frame-ui" }
gameframe-library = { path = "../crates/library" }
dioxus = { version = "0.7.10", default-features = false, features = ["lib", "launch", "desktop"] }
