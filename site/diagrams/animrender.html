<!doctype html>
<!--
  Check the animated diagrams in a browser, frame by frame. Serve the repository's root
  (python3 -m http.server 5181) and open http://127.0.0.1:5181/site/diagrams/animrender.html,
  or ?only=name.svg for one diagram. It loads every SVG in docs/assets/diagrams/ that animates,
  pauses it, steps through one loop and lists:
    - blows up: a moving or growing element leaves the card, or sits in its top-left corner (a
      token drawn before its motion starts); clipped content is left out;
    - covers a label: a visible animated shape is drawn over a text, over a fair part of it;
    - out of step: a sweeping marker passes over a box at one time, and the box lights up at another.
  The results are in window.results (an array) and in the table. animcheck.py checks timing.
-->
<meta charset="utf-8">
<title>Diagram animations</title>
<style>
  body { font: 13px ui-sans-serif, system-ui; background: #111; color: #ddd; margin: 16px; }
  table { border-collapse: collapse; } td, th { border-bottom: 1px solid #333; padding: 3px 8px; text-align: left; vertical-align: top; }
  /* The diagram under test sits on top, at full size and opacity: the hit test needs both. */
  #stage { position: absolute; left: 0; top: 0; z-index: 1; background: #111; }
</style>
<p id="status">Loading…</p>
<table id="out"><tr><th>Diagram</th><th>Kind</th><th>Element</th><th>Time</th><th>Detail</th></tr></table>
<div id="stage"></div>
<script>
const DIR = '/docs/assets/diagrams/'
const GEOM = new Set(['x', 'y', 'cx', 'cy', 'r', 'rx', 'width', 'height', 'd', 'transform'])
const results = []
window.results = results

function secs(v) {
  if (!v) return null
  const m = /^\s*(-?[\d.]+)\s*(ms|s)?\s*$/.exec(v)
  return m ? parseFloat(m[1]) / (m[2] === 'ms' ? 1000 : 1) : null
}
function name(el) {
  const t = el.tagName
  const id = el.id || el.getAttribute('x') || el.getAttribute('cx') || (el.getAttribute('d') || '').slice(0, 18)
  const label = el.textContent && el.tagName === 'text' ? ` "${el.textContent.slice(0, 20)}"` : ''
  return `<${t} ${id}>${label}`
}
function shown(el, svg) {
  // The opacity a reader sees: the product of every ancestor's opacity up to the svg.
  let o = 1
  for (let e = el; e && e !== svg.parentNode; e = e.parentNode) {
    const cs = getComputedStyle(e)
    o *= parseFloat(cs.opacity)
    if (cs.display === 'none' || cs.visibility === 'hidden') return 0
  }
  return o
}
function paints(el, svg) {
  const cs = getComputedStyle(el)
  const fill = cs.fill !== 'none' && parseFloat(cs.fillOpacity) > 0.5
  return fill && shown(el, svg) > 0.5
}
function after(a, b) { return !!(a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING) }
function within(a, b) { return a === b || a.contains(b) || b.contains(a) }

function clipped(el) { return !!el.closest('[clip-path], [mask]') }
function overlap(a, b) {
  const w = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x), h = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y)
  return w > 0 && h > 0 ? w * h : 0
}
function active(el, svg) {
  // How strongly an element shows its "event" now: its opacity, or 1 when its fill or stroke differs from the start.
  return shown(el, svg)
}

async function checkOne(file) {
  const text = await (await fetch(DIR + file, { cache: 'no-store' })).text()
  const stage = document.getElementById('stage')
  stage.innerHTML = text
  const svg = stage.querySelector('svg')
  const vb = svg.viewBox.baseVal
  svg.setAttribute('width', vb.width); svg.setAttribute('height', vb.height)
  svg.pauseAnimations()
  const anims = [...svg.querySelectorAll('animate, animateMotion, animateTransform')]
  const loops = anims.filter((a) => a.getAttribute('repeatCount') === 'indefinite').map((a) => secs(a.getAttribute('dur')) || 0)
  const cycle = Math.max(...loops, ...anims.map((a) => (secs(a.getAttribute('dur')) || 0) + Math.max(0, secs(a.getAttribute('begin')) || 0)), 1)
  const moving = new Set(), animated = new Set(), fading = new Set()
  for (const a of anims) {
    const t = a.parentNode, attr = a.getAttribute('attributeName'), type = a.getAttribute('type')
    animated.add(t)
    if (a.tagName === 'animateMotion' || (a.tagName === 'animateTransform' && type === 'translate') || ['x', 'y', 'cx', 'cy', 'r'].includes(attr)) moving.add(t)
    if (['opacity', 'fill', 'stroke', 'fill-opacity'].includes(attr)) fading.add(t)
  }
  const shapes = (root) => [...root.querySelectorAll('rect, circle, ellipse, path, line, polyline, polygon')].filter((e) => !e.closest('defs, marker'))
  const texts = [...svg.querySelectorAll('text')]
  const origin = svg.getBoundingClientRect()
  const box = (e) => { const r = e.getBoundingClientRect(); return { x: r.left - origin.left, y: r.top - origin.top, w: r.width, h: r.height } }
  const seen = new Set()
  const report = (kind, el, t, detail) => {
    const key = kind + name(el)
    if (seen.has(key)) return
    seen.add(key)
    results.push({ file, kind, element: name(el), time: +t.toFixed(2), detail })
  }
  // The moving and animated shapes a reader sees on top of other things (not text, not the card).
  const markers = [...animated].flatMap((el) => (el.tagName === 'g' ? shapes(el) : [el]).map((s) => [s, el])).filter(([s]) => s.tagName !== 'text')
  const steps = 120
  const track = new Map()   // moving element -> [{t, cx, cy}]
  const glow = new Map()    // fading element -> [{t, a}]
  for (let i = 0; i <= steps; i++) {
    const t = (cycle * i) / steps
    svg.setCurrentTime(t)
    for (const el of moving) {
      if (shown(el, svg) < 0.3) continue
      const cs = getComputedStyle(el)
      if (el.tagName !== 'g' && cs.fill === 'none' && cs.stroke === 'none') continue   // an invisible timer
      const b = box(el)
      if (b.w === 0 && b.h === 0) continue
      if (!clipped(el) && (b.x + b.w < 0 || b.y + b.h < 0 || b.x > vb.width || b.y > vb.height || b.w > vb.width * 1.05 || b.h > vb.height * 1.05))
        report('blows up', el, t, `at ${b.x.toFixed(0)},${b.y.toFixed(0)} ${b.w.toFixed(0)}×${b.h.toFixed(0)}, outside the ${vb.width}×${vb.height} card`)
      if (b.x < 2 && b.y < 2 && b.w < 30 && b.h < 30)
        report('blows up', el, t, 'sits in the top-left corner: a token drawn before its motion starts')
      const list = track.get(el) || []
      list.push({ t, cx: b.x + b.w / 2, cy: b.y + b.h / 2, b })
      track.set(el, list)
    }
    for (const el of fading) {
      const list = glow.get(el) || []
      list.push({ t, a: active(el, svg), fill: getComputedStyle(el).fill })
      glow.set(el, list)
    }
    // Covers a label: a visible animated shape drawn after a text, over a fair part of it.
    for (const tx of texts) {
      if (shown(tx, svg) < 0.3) continue
      const tb = box(tx)
      if (tb.w * tb.h < 20) continue
      for (const [s, owner] of markers) {
        if (owner.contains(tx) || !after(tx, s) || clipped(s)) continue
        if (shown(s, svg) < 0.4) continue
        const cs = getComputedStyle(s)
        if (cs.fill === 'none' || parseFloat(cs.fillOpacity) < 0.4) continue
        const ob = box(s)
        if (ob.w * ob.h > vb.width * vb.height * 0.3) continue   // a full-card overlay is meant to sit on top
        if (overlap(tb, ob) > 0.15 * tb.w * tb.h)
          report('covers a label', s, t, `drawn over "${tx.textContent.slice(0, 30)}": draw it before the label, or move its path`)
      }
    }
  }
  // Out of step: a sweeping marker passes over a box at one time, and the box lights up at another.
  for (const [el, list] of track) {
    const xs = list.map((p) => p.cx), ys = list.map((p) => p.cy)
    const spanX = Math.max(...xs) - Math.min(...xs), spanY = Math.max(...ys) - Math.min(...ys)
    if (Math.max(spanX, spanY) < vb.width * 0.25) continue
    const horizontal = spanX >= spanY
    for (const [r, g] of glow) {
      if (r === el || r.contains(el) || el.contains(r) || [...moving].some((m) => r.contains(m))) continue
      const rb = box(r)
      if (rb.w * rb.h > vb.width * vb.height * 0.3 || rb.w < 4 || rb.h < 4) continue
      // On the sweeper's path: the sweeper's band crosses the box.
      const band = list[0].b
      const crosses = horizontal ? (band.y < rb.y + rb.h && rb.y < band.y + band.h) : (band.x < rb.x + rb.w && rb.x < band.x + band.w)
      if (!crosses) continue
      const over = list.filter((p) => horizontal ? p.cx >= rb.x && p.cx <= rb.x + rb.w : p.cy >= rb.y && p.cy <= rb.y + rb.h).map((p) => p.t)
      if (!over.length) continue
      const as = g.map((q) => q.a), lo = Math.min(...as), hi = Math.max(...as)
      const fills = new Set(g.map((q) => q.fill))
      let on
      if (hi - lo > 0.3) on = g.filter((q) => q.a > lo + (hi - lo) / 2).map((q) => q.t)
      else if (fills.size > 1) { const first = g[0].fill; on = g.filter((q) => q.fill !== first).map((q) => q.t) }
      else continue
      if (!on.length || on.length > g.length * 0.6) continue   // lit most of the time: not an event
      const firstOn = Math.min(...on), firstOver = Math.min(...over), tol = cycle * 0.06
      const touches = on.some((t) => over.some((u) => Math.abs(t - u) <= tol))
      if (!touches) report('out of step', r, firstOn, `lights up at ${firstOn.toFixed(2)}s, but ${name(el)} reaches it at ${firstOver.toFixed(2)}s`)
    }
  }
}

async function main() {
  const only = new URLSearchParams(location.search).get('only')
  let files
  if (only) files = only.split(',')
  else {
    const listing = await (await fetch(DIR)).text()
    files = [...listing.matchAll(/href="([^"]+\.svg)"/g)].map((m) => decodeURIComponent(m[1]))
  }
  const status = document.getElementById('status')
  let n = 0
  for (const f of files) {
    const text = await (await fetch(DIR + f, { cache: 'no-store' })).text()
    if (!/<animate/.test(text)) continue
    n++
    status.textContent = `Checking ${f} (${n})…`
    try { await checkOne(f) } catch (e) { results.push({ file: f, kind: 'error', element: '', time: 0, detail: String(e) }) }
  }
  const out = document.getElementById('out')
  for (const r of results) out.insertAdjacentHTML('beforeend', `<tr><td>${r.file}</td><td>${r.kind}</td><td>${r.element.replace(/</g, '&lt;')}</td><td>${r.time}s</td><td>${r.detail.replace(/</g, '&lt;')}</td></tr>`)
  status.textContent = `${n} animated diagrams, ${new Set(results.map((r) => r.file)).size} with problems, ${results.length} problems`
  document.getElementById('stage').innerHTML = ''
  window.done = true
}
main()
</script>
