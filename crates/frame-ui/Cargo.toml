[package]
name = "gameframe-frame-ui"
description = "The frame's views as Dioxus components for the browser and the desktop: launcher, renderer choice with coverage grades, settings, the player's library, help pages and an event console, styled by the library page's design tokens"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.85"
keywords = ["game", "launcher", "dioxus", "ui", "wasm"]
categories = ["game-development", "gui"]

[dependencies]
gameframe-frame = { path = "../frame" }
gameframe-library = { path = "../library" }
dioxus = { version = "0.7.10", default-features = false, features = ["lib"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["time"] }
