[package]
name = "gameframe-library"
description = "The player's library for a port: game data, saves and opt-in sections (mods, screenshots, recordings), kept in folders or in the browser, with a plain HTML page to manage them"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.85"
keywords = ["game", "saves", "mods", "indexeddb", "wasm"]
categories = ["game-development", "wasm"]

[dependencies]
game-source = { package = "gameframe-game-source", path = "../game-source" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "console", "Event",
    "IdbFactory", "IdbDatabase", "IdbOpenDbRequest", "IdbRequest", "IdbTransaction",
    "IdbTransactionMode", "IdbObjectStore", "IdbObjectStoreParameters", "IdbKeyRange", "DomStringList",
    "Crypto", "SubtleCrypto", "CryptoKey", "AesGcmParams", "AesKeyGenParams",
] }
