# Clean implementations of hardware and runtime pieces that many old games need, taken from
# the case-study reimplementations and made generic. Each crate has its own README.
[workspace]
resolver = "2"
members = ["opl2", "opl3", "saa1099", "sn76496", "yac512", "ymz263", "adlib-gold", "sound-blaster", "wma", "msvc-crt", "turbo-pascal", "mmx", "texel", "raster", "d3d", "bitmap-font", "voodoo", "powervr", "rage", "virge", "scale", "indeo", "disc-image", "game-source", "library", "frame", "frame-ui", "report", "x87"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tanepiper/game-frame"
rust-version = "1.80"
