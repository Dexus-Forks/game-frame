<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Three seams and what each lets a port check: the numbers after geometry, the call stream at the seam, and the pixels after rasterising, which are exact against a software renderer or a chip model and close against a modern GPU">
<title>Three seams and what each lets a port check: the numbers after geometry, the call stream at the seam, and the pixels after rasterising, which are exact against a software renderer or a chip model and close against a modern GPU</title>
