<text x="195.0" y="266.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">bitcompare.py)</text>
<path d="M456.0 120.0L456.0 152.0" stroke="#f59e0b" stroke-width="2" fill="none" stroke-dasharray="4 3"/>
<circle cx="456" cy="120" r="5" fill="#f59e0b"/>
<rect x="331.0" y="156.0" width="250.0" height="150.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.14"/>
<text x="456.0" y="180.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f59e0b" text-anchor="middle">B  the call stream</text>
<text x="456.0" y="202.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">call for call</text>
<text x="456.0" y="230.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">every call and argument, in order</text>
<text x="456.0" y="248.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">against a recording made by the</text>
<text x="456.0" y="266.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">replacement DLLs</text>
<path d="M717.0 120.0L717.0 152.0" stroke="#c084fc" stroke-width="2" fill="none" stroke-dasharray="4 3"/>
<circle cx="717" cy="120" r="5" fill="#c084fc"/>
<rect x="592.0" y="156.0" width="250.0" height="150.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.14"/>
<text x="717.0" y="180.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#c084fc" text-anchor="middle">C  pixels</text>
<text x="717.0" y="202.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">depends on the device</text>
<text x="717.0" y="230.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">software reference: exact</text>
<text x="717.0" y="248.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">chip model: exact against the model</text>
<text x="717.0" y="266.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">modern GPU: within a tolerance</text>
<text x="450.0" y="334.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">Check the earliest seam first: a wrong number at A shows as wrong calls at B and wrong pixels at C.</text>
</svg>
