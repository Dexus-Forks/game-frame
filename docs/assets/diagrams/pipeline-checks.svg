<text x="630.0" y="103.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">4  rasterising</text>
<path d="M535.0 98.0L550.0 98.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="726.0" y="78.0" width="156.0" height="40.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<text x="804.0" y="103.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">5  display</text>
<path d="M709.0 98.0L724.0 98.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M195.0 120.0L195.0 152.0" stroke="#2dd4bf" stroke-width="2" fill="none" stroke-dasharray="4 3"/>
<circle cx="195" cy="120" r="5" fill="#2dd4bf"/>
<rect x="70.0" y="156.0" width="250.0" height="150.0" rx="6" fill="#2dd4bf" stroke="none" fill-opacity="0.14"/>
<text x="195.0" y="180.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2dd4bf" text-anchor="middle">A  numbers</text>
<text x="195.0" y="202.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle">bit-exact</text>
<text x="195.0" y="230.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="middle">vertices, matrices, the sort order</text>
