<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="One frame drawn by the card and the CPU together: the card clears and draws the 3D scene, the CPU locks the frame buffer and writes the interface into it, then the buffers swap">
