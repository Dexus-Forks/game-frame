<text x="24.0" y="256.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">Japanese fonts show 0x5C as a yen sign. Code that splits paths at a backslash must step through text</text>
