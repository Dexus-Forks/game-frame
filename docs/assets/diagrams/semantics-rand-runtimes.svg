<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="The first three numbers that rand() returns after srand(1) in the Microsoft C runtime, in Borland C and in the GNU C library">
<title>The first three numbers that rand() returns after srand(1) in the Microsoft C runtime, in Borland C and in the GNU C library</title>
<rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
