<rect x="27" y="83" width="162" height="134" rx="8" fill="none" stroke="#f59e0b" stroke-width="2.5"><animateTransform attributeName="transform" type="translate" values="0 0;174 0;348 0;522 0;696 0" calcMode="discrete" dur="7.5s" repeatCount="indefinite"/></rect>
<text x="450" y="274" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f59e0b" text-anchor="middle" opacity="0">objects and a camera<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.000;0.000;0.200;0.200;1" dur="7.5s" repeatCount="indefinite"/></text>
<text x="450" y="274" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f59e0b" text-anchor="middle" opacity="0">screen-space vertices with 1/w<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.200;0.200;0.400;0.400;1" dur="7.5s" repeatCount="indefinite"/></text>
<text x="450" y="274" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f59e0b" text-anchor="middle" opacity="0">draw calls and texture uploads<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.400;0.400;0.600;0.600;1" dur="7.5s" repeatCount="indefinite"/></text>
<text x="450" y="274" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f59e0b" text-anchor="middle" opacity="0">pixels in a frame buffer<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.600;0.600;0.800;0.800;1" dur="7.5s" repeatCount="indefinite"/></text>
