<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="A C# iterator method with two yield returns, beside the class the compiler makes from it, whose MoveNext switches on a state field and stores the next state before each return">
<title>A C# iterator method with two yield returns, beside the class the compiler makes from it, whose MoveNext switches on a state field and stores the next state before each return</title>
<rect x="0.5" y="0.5" width="899" height="359" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<rect x="24.0" y="84.0" width="380.0" height="190.0" rx="6" fill="#64748b" stroke="none" fill-opacity="0.12"/>
<rect x="440.0" y="84.0" width="436.0" height="190.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.12"/>
<rect x="520.0" y="122.0" width="344.0" height="30.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<rect x="452" y="118" width="416" height="38" rx="5" fill="none" stroke="#2dd4bf" stroke-width="2.5" opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0;0.3333" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<rect x="520.0" y="168.0" width="344.0" height="30.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<rect x="452" y="164" width="416" height="38" rx="5" fill="none" stroke="#2dd4bf" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3333;0.6667" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<rect x="520.0" y="214.0" width="344.0" height="30.0" rx="3" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<rect x="452" y="210" width="416" height="38" rx="5" fill="none" stroke="#2dd4bf" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6667;1.0000" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">A UNITY COROUTINE AFTER COMPILING</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">The compiler turns the method into a class. MoveNext jumps to the code after the last yield.</text>
<text x="36.0" y="104.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">the source</text>
<text x="36.0" y="128.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#e2ece9" text-anchor="start">IEnumerator FadeOut() {</text>
<text x="60.0" y="148.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#e2ece9" text-anchor="start">alpha = 1;</text>
<text x="60.0" y="168.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#e2ece9" text-anchor="start">yield return null;</text>
<text x="60.0" y="188.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#e2ece9" text-anchor="start">alpha = 0.5f;</text>
<text x="60.0" y="208.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#e2ece9" text-anchor="start">yield return new WaitForSeconds(2);</text>
<text x="60.0" y="228.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#e2ece9" text-anchor="start">alpha = 0;</text>
<text x="36.0" y="248.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#e2ece9" text-anchor="start">}</text>
<text x="452.0" y="104.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">class &lt;FadeOut&gt;d__3, method MoveNext</text>
<text x="456.0" y="142.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#f59e0b" text-anchor="start">case 0:</text>
<text x="530.0" y="142.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">alpha = 1; state = 1; return true</text>
<text x="456.0" y="188.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#f59e0b" text-anchor="start">case 1:</text>
<text x="530.0" y="188.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">alpha = 0.5f; state = 2; return true</text>
<text x="456.0" y="234.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#f59e0b" text-anchor="start">case 2:</text>
<text x="530.0" y="234.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="start">alpha = 0; state = -1; return false</text>
<text x="24.0" y="300.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">Each call of MoveNext runs one piece. Unity calls it again in the next frame after yield return null,</text>
<text x="24.0" y="318.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">and two seconds of scaled game time after WaitForSeconds(2). The state field &lt;&gt;1__state holds the piece to run.</text>
</svg>
