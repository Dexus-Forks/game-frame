<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-label="What happens when a signed integer is divided by zero, and when the most negative value is divided by -1, on six CPUs and in four languages a port may use">
