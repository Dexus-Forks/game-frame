<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="The port drawn as a graphics card: an exact core runs stages 1 to 3 and calls one device interface; behind it a software device, card profiles and a modern device; hooks at the interface record, replace and add; the vanilla build ships the reference devices and the extra build adds the rest">
<title>The port drawn as a graphics card: an exact core runs stages 1 to 3 and calls one device interface; behind it a software device, card profiles and a modern device; hooks at the interface record, replace and add; the vanilla build ships the reference devices and the extra build adds the rest</title>
<rect x="0.5" y="0.5" width="899" height="399" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
<text x="24.0" y="34.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="start" letter-spacing="0.08em">THE PORT AS A VIRTUAL GRAPHICS CARD</text>
<text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa9a5" text-anchor="start">Stages 1 to 3 are ported exactly. Stage 4 is a device you can swap.</text>
<rect x="30.0" y="110.0" width="230.0" height="190.0" rx="8" fill="#2dd4bf" stroke="none" fill-opacity="0.18"/>
<text x="145.0" y="138.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e2ece9" text-anchor="middle">the exact core</text>
<rect x="50.0" y="156.0" width="190.0" height="32.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.3"/>
<text x="145.0" y="177.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="middle">1 game state</text>
<rect x="50.0" y="198.0" width="190.0" height="32.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.3"/>
<text x="145.0" y="219.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="middle">2 geometry</text>
<rect x="50.0" y="240.0" width="190.0" height="32.0" rx="4" fill="#2dd4bf" stroke="none" fill-opacity="0.3"/>
<text x="145.0" y="261.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e2ece9" text-anchor="middle">3 the calls of a frame</text>
<rect x="330.0" y="96.0" width="36.0" height="218.0" rx="6" fill="#f59e0b" stroke="none" fill-opacity="0.45"/>
<text x="348.0" y="205.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2ece9" text-anchor="middle" transform="rotate(-90 348 205)">device interface</text>
<path d="M262.0 205.0L326.0 205.0" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="430.0" y="100.0" width="320.0" height="60.0" rx="6" fill="#c084fc" stroke="none" fill-opacity="0.22"/>
<text x="446.0" y="124.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">software device</text>
<text x="446.0" y="144.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">the game's own rasteriser, ported exactly</text>
<text x="764.0" y="135.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#c084fc" text-anchor="start">vanilla</text>
<path d="M368.0 205.0L426.0 130.0" stroke="#8fa9a5" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
<rect x="430.0" y="172.0" width="320.0" height="60.0" rx="6" fill="#60a5fa" stroke="none" fill-opacity="0.22"/>
<text x="446.0" y="196.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">card profiles</text>
<text x="446.0" y="216.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">gameframe-voodoo, -rage, -virge, -powervr</text>
<text x="764.0" y="207.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#60a5fa" text-anchor="start">vanilla</text>
<path d="M368.0 205.0L426.0 202.0" stroke="#8fa9a5" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
<rect x="430.0" y="244.0" width="320.0" height="60.0" rx="6" fill="#4ade80" stroke="none" fill-opacity="0.22"/>
<text x="446.0" y="268.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2ece9" text-anchor="start">modern device</text>
<text x="446.0" y="288.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">wgpu or OpenGL, any size, filtering, widescreen</text>
<text x="764.0" y="279.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="start">extra</text>
<path d="M368.0 205.0L426.0 274.0" stroke="#8fa9a5" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
<rect x="230.0" y="330.0" width="112.0" height="28.0" rx="4" fill="#4ade80" stroke="none" fill-opacity="0.2"/>
<text x="286.0" y="349.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="middle">record the calls</text>
<rect x="360.0" y="330.0" width="112.0" height="28.0" rx="4" fill="#4ade80" stroke="none" fill-opacity="0.2"/>
<text x="416.0" y="349.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="middle">replace textures</text>
<rect x="490.0" y="330.0" width="112.0" height="28.0" rx="4" fill="#4ade80" stroke="none" fill-opacity="0.2"/>
<text x="546.0" y="349.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#e2ece9" text-anchor="middle">add draws (mods)</text>
<path d="M348.0 316.0L348.0 328.0" stroke="#4ade80" stroke-width="1.5" fill="none"/>
<text x="30.0" y="349.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#4ade80" text-anchor="start">extra build hooks:</text>
<text x="30.0" y="382.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa9a5" text-anchor="start">Every device and hook takes the same calls, so a recording, a test or a mod works whichever device draws.</text>
</svg>
