<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Three ways an interpreter dispatches opcodes: a switch inside one loop, a loop that calls handlers through a table of function pointers, and threaded code where each handler jumps to the next">
<title>Three ways an interpreter dispatches opcodes: a switch inside one loop, a loop that calls handlers through a table of function pointers, and threaded code where each handler jumps to the next</title>
<rect x="0.5" y="0.5" width="899" height="329" rx="10" fill="#0d1b1e" stroke="#1f3d40"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fa9a5"/></marker></defs>
