<text x="24.0" y="316.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa9a5" text-anchor="start">SCUMM, SCI and Lua use a switch. UnrealScript calls native functions through a table. GCC's computed goto gives threaded code.</text>
</svg>
