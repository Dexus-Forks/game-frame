<path d="M740.0 190.0L740.0 198.0" stroke="#8fa9a5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="628.0" y="200.0" width="224.0" height="30.0" rx="4" fill="#c084fc" stroke="none" fill-opacity="0.3"/>
