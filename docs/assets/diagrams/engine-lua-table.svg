<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="A Lua table with an array part holding keys 1 to 4 and a hash part holding named keys in its internal node order; next() visits the array part first, then the nodes in their order">
