# Replacement libraries for the PC 3D cards of 1997 and for DirectDraw: one DLL per library a
# game imports, and the pieces they share. Built for 32-bit Windows (.cargo/config.toml);
# `raster`, `scalers`, `pixels`, `shim`'s settings and `sgl`'s scene graph are tested on the
# host. See README.md.
[workspace]
resolver = "3"
members = ["glide", "shim", "ati3dcif", "s3dtkw", "ddraw", "raster", "scalers", "sgl", "pixels", "maxi94"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
repository = "https://github.com/tanepiper/game-frame"

# Two builds of every DLL, in target/i686-pc-windows-gnu/<profile>/:
# - debug (`cargo build`): symbols, overflow and debug assertions, the first 50 calls of each
#   stub and each gap logged one by one, and OpenGL errors checked after each frame. Optimised
#   a little, so a game still runs at a usable speed.
# - release (`cargo build --release`): fully optimised with link-time optimisation, no symbols,
#   only the first call of each stub and gap logged. For players.
[profile.dev]
panic = "abort"
opt-level = 1
debug = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
