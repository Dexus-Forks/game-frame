[package]
name = "s3dtkw"
description = "S3D Toolkit (S3DTKW.dll), the S3 ViRGE library: the faces a game gives the chip drawn in software into its surface"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
virge = { package = "gameframe-virge", path = "../../crates/virge" }
pixels = { path = "../pixels" }
raster = { path = "../raster" }
shim = { path = "../shim" }
