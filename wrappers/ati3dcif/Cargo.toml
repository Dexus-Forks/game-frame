[package]
name = "ati3dcif"
description = "ATI3DCIF (ati3dcif.dll), the ATI 3D Rage interface: the faces a game gives the chip drawn in software into its DirectDraw surface"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
gpu-1997 = { package = "gameframe-gpu-1997", path = "../../crates/gpu-1997" }
pixels = { path = "../pixels" }
raster = { path = "../raster" }
shim = { path = "../shim" }
