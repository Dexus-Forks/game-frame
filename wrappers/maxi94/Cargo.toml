[package]
name = "maxi94"
description = "94DLL32.dll, the Guillemot Maxi Sound 64 (Dream SAM9407) library: a stand-in whose wave streams are the system's wave outputs, so games built for that card play their sound"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shim = { path = "../shim" }
